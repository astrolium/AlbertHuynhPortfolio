<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Albert Huynh, Builder</title>
    <meta
      name="description"
      content="Albert Huynh is a builder working across data, go-to-market and product. Previously at Clio, Tecsys and DarwinAI."
    />

    <!-- SVG first for browsers that take it; .ico is the fallback. -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="32x32" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />

    <!-- Kept in step with the page by src/lib/theme.js, which is the only
         thing that knows whether "auto" currently resolves to dark. -->
    <meta name="theme-color" content="#faf9f5" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Albert Huynh, Builder" />
    <meta
      property="og:description"
      content="Builder working across data, go-to-market and product. Previously at Clio, Tecsys and DarwinAI."
    />
    <meta property="og:url" content="https://alberthuynh.netlify.app/" />
    <!-- Absolute, because some link-preview crawlers won't resolve a relative
         image. A new filename whenever the image changes, because apps
         (iMessage especially) cache previews by image URL. -->
    <meta property="og:image" content="https://alberthuynh.netlify.app/img/og-builder.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Albert Huynh: builder, explorer and creative." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://alberthuynh.netlify.app/img/og-builder.jpg" />

    <script>
      // Applied before first paint, so the page never flashes the wrong
      // appearance. Light is the default; dark and auto are chosen.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("ah-appearance");
        } catch (error) {}
        if (stored !== "auto") {
          document.documentElement.setAttribute(
            "data-theme",
            stored === "dark" ? "dark" : "light"
          );
        }
      })();
    </script>
  </head>
  <body>
    <noscript>This site needs JavaScript to run.</noscript>
    <div id="root"></div>

    <!-- Netlify reads forms from static HTML at deploy time, never from the
         React bundle. This hidden twin registers the "contact" form; the chat
         composer in src/sections/Contact.jsx posts to it. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="email" name="email" />
      <input name="bot-field" />
    </form>
  </body>
</html>
