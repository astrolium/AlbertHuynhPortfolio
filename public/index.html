<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Albert Huynh, Product Manager</title>
    <meta
      name="description"
      content="Albert Huynh is a product manager working across data, go-to-market and product. Previously at Clio, Tecsys and DarwinAI."
    />

    <!-- SVG first for browsers that take it; .ico is the fallback. -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="32x32" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />

    <!-- Kept in step with the page by src/lib/theme.js, which is the only
         thing that knows whether "auto" currently resolves to dark. -->
    <meta name="theme-color" content="#faf9f5" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Albert Huynh, Product Manager" />
    <meta
      property="og:description"
      content="Product manager working across data, go-to-market and product. Previously at Clio, Tecsys and DarwinAI."
    />
    <meta property="og:image" content="%PUBLIC_URL%/img/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // Applied before first paint, so the page never flashes the wrong
      // appearance. Light is the default; dark and auto are chosen.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("ah-appearance");
        } catch (error) {}
        if (stored !== "auto") {
          document.documentElement.setAttribute(
            "data-theme",
            stored === "dark" ? "dark" : "light"
          );
        }
      })();
    </script>
  </head>
  <body>
    <noscript>This site needs JavaScript to run.</noscript>
    <div id="root"></div>
  </body>
</html>
